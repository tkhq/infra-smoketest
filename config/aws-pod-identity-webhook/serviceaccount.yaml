apiVersion: v1
kind: ServiceAccount
metadata:
  name: infra-smoketest-aws
  annotations:
    # The single source of the expected AWS identity. The controller reads this
    # annotation when it accepts a Run; override it per environment with a patch.
    eks.amazonaws.com/role-arn: arn:aws:iam::361645878370:role/infra-smoketest-aws
    eks.amazonaws.com/audience: sts.amazonaws.com
    eks.amazonaws.com/sts-regional-endpoints: "true"
automountServiceAccountToken: false
