apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-smoketest
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infra-smoketest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infra-smoketest
    spec:
      serviceAccountName: infra-smoketest-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: turnkey.engineering/designated-for
                    operator: NotIn
                    values: [smoke-tests]
      containers:
        - name: controller
          # Replace using a Kustomize image override before installation.
          image: ghcr.io/tkhq/infra-smoketest:dev
          args:
            - controller
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
