apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: infra-smoketest
  labels:
    app.kubernetes.io/name: infra-smoketest
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: infra-smoketest
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
